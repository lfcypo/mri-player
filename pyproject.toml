[project]
name = "mri-player"
version = "0.1.0"
description = "Offline WAV to Pulseq gradient sequence conversion for GE Discovery MR750 3.0T"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pypulseq==1.5.0.post1",
    "scipy>=1.14,<2",
    "soundfile>=0.13,<1",
]

[project.scripts]
mri-player = "mri_player.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_player"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
